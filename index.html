<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ITE A3 - ប្រព័ន្ធគ្រប់គ្រងថ្នាក់រៀនលំដាប់កំពូល</title>
  <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.tailwindcss.com"></script>
  
  <style>
    body {
      font-family: 'Kantumruy Pro', sans-serif;
      background: #090d16;
      overflow-x: hidden;
    }
    
    .bg-mesh {
      position: fixed;
      inset: 0;
      background: 
        radial-gradient(circle at 20% 30%, rgba(99, 102, 241, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 80% 70%, rgba(139, 92, 246, 0.15) 0%, transparent 45%),
        linear-gradient(rgba(9, 13, 22, 0.5), rgba(9, 13, 22, 0.5)),
        url('https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEjXxGArgP0d4MOf1uHAzVD2CkwE7Oyv2NdKa1m5s3gqO3GfGiV8v1e5BwobjNX60kbclIla3MK2OwuiaxQ0klZ-vZfSCzfHZd7-GIbG4MuL6f6CY7BT6wP3QQ-SXyypGHsmUCrmBPqV4n7v/s1600/Untitled.png');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      z-index: -2;
    }

    .glow-blob {
      position: fixed;
      width: 450px;
      height: 450px;
      border-radius: 50%;
      filter: blur(120px);
      opacity: 0.4;
      pointer-events: none;
      z-index: -1;
      animation: floatGlow 12s infinite alternate ease-in-out;
    }
    .blob-1 { top: -10%; left: -10%; }
    .blob-2 { bottom: -10%; right: -10%; }

    @keyframes floatGlow {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(60px, 40px) scale(1.15); }
    }

    .premium-glass {
      background: rgba(13, 20, 38, 0.45);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.07);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }
    
    .premium-glass:hover {
      background: rgba(17, 27, 54, 0.6);
      border-color: rgba(99, 102, 241, 0.35);
      box-shadow: 0 20px 40px rgba(99, 102, 241, 0.15);
      transform: translateY(-6px) scale(1.01);
    }

    .shimmer-line {
      background: linear-gradient(90deg, #6366f1, #a855f7, #06b6d4, #6366f1);
      background-size: 200% auto;
      animation: shimmer 4s linear infinite;
    }
    @keyframes shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }

    .gradient-text {
      background: linear-gradient(to right, #6366f1, #a855f7, #06b6d4);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
  </style>
</head>
<body class="text-slate-100 min-h-screen flex flex-col justify-between p-4 md:p-8 relative">

  <div class="bg-mesh"></div>
  <div class="glow-blob blob-1 bg-cyan-500/20"></div>
  <div class="glow-blob blob-2 bg-purple-500/20"></div>

  <div id="mainApp" class="w-full flex flex-col justify-between flex-1">
    <header class="text-center max-w-3xl mx-auto mt-8 mb-4 space-y-4">
      <div class="relative inline-block group">
        <div class="absolute inset-0 bg-indigo-500 rounded-full blur-xl opacity-30 group-hover:opacity-50 transition duration-500"></div>
        <img src="https://www.rupp.edu.kh/assets/logo.svg" class="w-20 md:w-24 mx-auto relative drop-shadow-2xl transition-transform duration-500 group-hover:rotate-6" alt="RUPP Logo">
      </div>
      
      <div class="space-y-1">
        <h1 class="text-3xl md:text-5xl font-black tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-white via-slate-100 to-indigo-200">
          ប្រព័ន្ធគ្រប់គ្រងថ្នាក់រៀន <span class="gradient-text">ITE A3</span>
        </h1>
        <p class="text-[11px] md:text-xs tracking-widest text-indigo-300 font-medium uppercase bg-indigo-950/40 px-3 py-1 rounded-full border border-indigo-500/10 backdrop-blur-md inline-block">
          ⚡ INFORMATION TECHNOLOGY & ENGINEERING • RUPP
        </p>
      </div>
      <div class="w-32 h-1.5 shimmer-line mx-auto rounded-full shadow-lg shadow-indigo-500/20"></div>
    </header>

    <div id="toastContainer" class="fixed bottom-5 right-5 z-50 space-y-3 max-w-sm w-full pointer-events-none"></div>

    <main class="max-w-4xl mx-auto w-full my-8 md:my-12 px-2">
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
        
        <a href="home.html" class="premium-glass p-6 rounded-2xl flex items-center gap-5 group relative overflow-hidden">
          <div class="absolute -right-6 -bottom-6 text-white/5 text-7xl font-bold group-hover:scale-125 transition duration-500"><i class="fa-solid fa-square-poll-horizontal"></i></div>
          <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-amber-400 via-orange-500 to-red-500 flex items-center justify-center text-white text-2xl shadow-lg shadow-orange-500/30 ring-4 ring-orange-500/10">
            <i class="fa-solid fa-square-poll-horizontal"></i>
          </div>
          <div class="flex-1 z-10">
            <h3 class="text-lg font-bold group-hover:text-amber-400 transition-colors duration-300">វេនយកស្លាយប្រចាំថ្ងៃ</h3>
            <p class="text-xs text-slate-400 mt-1 leading-relaxed">ពិនិត្យមើលអ្នកត្រូវវេន និងការយកស្លាយ</p>
          </div>
        </a>

        <button onclick="showMaintenanceToast()" class="premium-glass p-6 rounded-2xl flex items-center gap-5 group text-left w-full relative overflow-hidden">
          <div class="absolute -right-6 -bottom-6 text-white/5 text-7xl font-bold group-hover:scale-125 transition duration-500"><i class="fa-solid fa-file-signature"></i></div>
          <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-pink-500 via-red-500 to-rose-600 flex items-center justify-center text-white text-2xl shadow-lg shadow-red-500/30 ring-4 ring-red-500/10">
            <i class="fa-solid fa-file-signature"></i>
          </div>
          <div class="flex-1 z-10">
            <h3 class="text-lg font-bold group-hover:text-red-400 transition-colors duration-300">ប្រព័ន្ធសុំច្បាប់ (Absent)</h3>
            <p class="text-xs text-slate-400 mt-1 leading-relaxed">ផ្ញើលិខិតសុំច្បាប់ឈប់សម្រាក</p>
          </div>
        </button>

        <button onclick="showMaintenanceToast()" class="premium-glass p-6 rounded-2xl flex items-center gap-5 group text-left w-full relative overflow-hidden">
          <div class="absolute -right-6 -bottom-6 text-white/5 text-7xl font-bold group-hover:scale-125 transition duration-500"><i class="fa-regular fa-clock"></i></div>
          <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-cyan-400 via-sky-500 to-indigo-600 flex items-center justify-center text-white text-2xl shadow-lg shadow-sky-500/30 ring-4 ring-sky-500/10">
            <i class="fa-regular fa-clock"></i>
          </div>
          <div class="flex-1 z-10">
            <h3 class="text-lg font-bold group-hover:text-sky-400 transition-colors duration-300">ប្រព័ន្ធសុំយឺត (Late)</h3>
            <p class="text-xs text-slate-400 mt-1 leading-relaxed">ជូនដំណឹងក្នុងករណីមកយឺត</p>
          </div>
        </button>

        <a href="https://t.me/+nLE3Q8E6MN41NGM1" target="_blank" class="premium-glass p-6 rounded-2xl flex items-center gap-5 group relative overflow-hidden">
          <div class="absolute -right-6 -bottom-6 text-white/5 text-7xl font-bold group-hover:scale-125 transition duration-500"><i class="fa-brands fa-telegram"></i></div>
          <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-blue-500 via-sky-400 to-teal-400 flex items-center justify-center text-white text-2xl shadow-lg shadow-sky-500/30 ring-4 ring-sky-500/10">
            <i class="fa-brands fa-telegram text-2xl"></i>
          </div>
          <div class="flex-1 z-10">
            <h3 class="text-lg font-bold group-hover:text-sky-300 transition-colors duration-300">ក្រុម Telegram ថ្នាក់</h3>
            <p class="text-xs text-slate-400 mt-1 leading-relaxed">ចូលទៅកាន់ការពិភាក្សាផ្លូវការ</p>
          </div>
        </a>
      </div>
    </main>

    <footer class="w-full text-center py-5 text-xs text-slate-500 border-t border-white/5 bg-slate-950/20 backdrop-blur-md">
      <p class="font-medium">👨‍💻 Core Architecture Developed for <span class="text-indigo-400 font-semibold">ITE A3 Community</span></p>
    </footer>
  </div>

<script>
function showMaintenanceToast() {
  const container = document.getElementById('toastContainer');
  const toast = document.createElement('div');
  
  toast.className = `p-4 rounded-2xl border backdrop-blur-xl shadow-2xl flex items-center gap-3 pointer-events-auto transition-all duration-300 opacity-0 transform translate-y-2 bg-amber-950/80 border-amber-500/30 text-amber-200`;
  toast.innerHTML = `<div class="w-7 h-7 rounded-full bg-amber-500/20 flex items-center justify-center text-amber-400"><i class="fa-solid fa-screwdriver-wrench"></i></div> <div class="text-xs font-medium flex-1">⚙️ ប្រព័ន្ធកំពុងជួសជុល សូមរង់ចាំបន្តិចបាទ!</div>`;
  
  container.appendChild(toast);
  
  setTimeout(() => {
    toast.classList.remove('opacity-0', 'translate-y-2');
    toast.classList.add('opacity-100', 'translate-y-0');
  }, 50);

  setTimeout(() => {
    toast.classList.remove('opacity-100', 'translate-y-0');
    toast.classList.add('opacity-0', 'translate-y-[-10px]');
    setTimeout(() => toast.remove(), 300);
  }, 3000);
}

// Disable Right-Click and basic Inspection tools
document.addEventListener('contextmenu', event => event.preventDefault());
document.onkeydown = function(e) {
  if (e.keyCode == 123 || (e.ctrlKey && e.shiftKey && (e.keyCode == 'I'.charCodeAt(0) || e.keyCode == 'J'.charCodeAt(0))) || (e.ctrlKey && e.keyCode == 'U'.charCodeAt(0))) {
    return false;
  }
}
</script>
</body>
</html>
